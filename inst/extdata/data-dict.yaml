      Each row is a position of one made-up vessel, a minute apart for 45 minutes, with spikes and runs that a speed
      filter should flag; for testing `rb_flag_ping_impossible()`.
    details: |
      **Cite:** [@ramb]

      **Licence:** GPL (>= 3), as ramb.

      **Changes:** made for ramb (`data-raw/DATASET.R`).
    source:
      parquet: whacks1.parquet
    origin: https://github.com/einarhjorleifsson/ramb/blob/main/data-raw/DATASET.R
    columns:
      - name: .rid
        type: number(id)
        constraints: [primary_key]
        description: Row number.
        examples: [1, 13, 25, 34, 46]
      - name: vid
        type: number(id)
        description: The vessel.
        examples: [1]
      - name: tid
        type: number(id)
        description: The trip.
        examples: [1]
      - name: lon
        type: number(quantity)
        units: degrees east
        description: Longitude.
        range: [-25.04, -24.5]
      - name: lat
        type: number(quantity)
        units: degrees north
        description: Latitude.
        range: [62, 62.2]
      - name: time
        type: datetime
        time_zone: naive
        description: Time of the position.
        range: [2022-10-15T00:00:00, 2022-10-15T00:45:00]
      - name: whacks
