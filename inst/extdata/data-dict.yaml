      Each row is a GPS position, every 60 s, of one of five small-scale creel (pot) vessels in Scotland on one trip
      each, May and June 2017, with the behaviour an observer recorded.
    details: |
      **Cite:** [@mendo2019; @mendo2019data]

      **Licence:** CC0 1.0 (Dryad).

      **Changes:** the vessel ids made integers (GP004 renamed GP005), and longitude and latitude added from the UTM
      zone 30N coordinates (`data-raw/DATASET.R`).
    source:
      parquet: creel.parquet
    origin: https://github.com/einarhjorleifsson/ramb/blob/main/data-raw/DATASET.R
    columns:
      - name: id
        type: number(id)
        description: The vessel; each made one trip.
        examples: [1, 2, 3, 4, 5]
      - name: rowid
        type: number(ordinal)
        description: The position's number within its vessel's trip.
        range: [1, 583]
      - name: time
        type: datetime
        time_zone: naive
        description: Time of the position, as given; the source states no zone.
        range: [2017-05-19T06:50:28, 2017-06-06T13:55:05]
      - name: x
        type: number(quantity)
        units: m
        description: Easting, UTM zone 30N (WGS 84), metres.
        range: [134615, 696813.1]
      - name: "y"
        type: number(quantity)
        units: m
        description: Northing, UTM zone 30N (WGS 84), metres.
        range: [6089861, 6606441]
      - name: lon
        type: number(quantity)
        units: degrees east
        description: Longitude.
        range: [-8.81527104011275, 0.480924316781787]
      - name: lat
        type: number(quantity)
        units: degrees north
        description: Latitude.
        range: [54.9397613512083, 59.551309931636]
      - name: behaviour
        type: enum
        description: The observer's record of what the vessel was doing.
        values: [hauling, shooting, steaming]

