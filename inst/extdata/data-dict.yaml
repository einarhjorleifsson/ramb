  - name: wkssfgeo_cnr_dansk_trips
    label: The Danish tracks cut into trips by two methods
    description: >
      Each row is a trip of the Danish tracks (`dansk`) as one of two methods cut them: CNR-IRBIM's (94 trips) and
      jepol, WKSSFGEO's rule `define_trips_pol` (90 trips). CNR-IRBIM made both for WKSSFGEO, to compare the methods.
    details: |
      **Cite:** [@galdelli2019; @wkssfgeo_cnr_github; @ices2022wkssfgeo]

      **Licence:** GNU GPL version 3, the licence of the folder `R-dev/galdelli_pulcinella_tassetti`.

      **Changes:** `galdelli_trips.rData` and `jepol_trips.rData` of `R-dev/galdelli_pulcinella_tassetti/data`
      (WKSSFGEO, `dev_branch`), stacked with `method` added. Columns renamed: `start_timestamp` and `depart` to `T1`,
      `end_timestamp` and `return` to `T2`, `departure` and `arrival` to `port_from` and `port_to`. The galdelli
      `trip_id` is made of vessel and trip number; `duration_hrs` is left out, being `T2` less `T1`
      (`data-raw/wkssfgeo_examples.R`).
    source:
      parquet: wkssfgeo_cnr_dansk_trips.parquet
    origin: https://github.com/einarhjorleifsson/ramb/blob/main/data-raw/wkssfgeo_examples.R
    columns:
      - name: method
        type: enum
        description: The method that cut the trip.
        values:
          galdelli: CNR-IRBIM's method (Galdelli et al. 2019), its table `galdelli_trips`
          jepol: WKSSFGEO's rule `define_trips_pol`, its table `jepol_trips`
      - name: vessel_id
        type: string
        description: The vessel of `dansk`.
        examples: [EX_1, EX_10, EX_9]
      - name: trip_id
        type: string
        description: >
          The trip: the vessel and the method's trip number. galdelli numbers its trips over all vessels, jepol per
          vessel.
        examples: [EX_10_1, EX_11_3, EX_1_1]
      - name: T1
        type: datetime
        time_zone: naive
        description: The trip's start, as the method gives it.
        range: [2012-12-03T05:08:58, 2020-10-24T07:04:06]
      - name: T2
        type: datetime
        time_zone: naive
        description: The trip's end, as the method gives it.
        range: [2012-12-03T10:01:50, 2020-10-24T13:37:53]
      - name: port_from
        type: number(id)
        description: The departure harbour, the `SI_HARB` of `dansk_harbours`; galdelli only, null for jepol.
        examples: [86, 141, 903]
      - name: port_to
        type: number(id)
        description: The arrival harbour, the `SI_HARB` of `dansk_harbours`; galdelli only, null for jepol.
        examples: [136, 141, 903]

