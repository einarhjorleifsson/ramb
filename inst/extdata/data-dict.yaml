  - name: benthis_parameters
    label: BENTHIS gear groups, gear width and seabed contact
    description: >
      Each row is one of 14 BENTHIS gear groups (eight otter trawl, three beam trawl, two demersal seine, one dredge):
      the model of gear width from vessel size, and the share of the gear's footprint that reaches into the seabed.
      Used by `rb_predict_gear_width()`.
    details: |
      **Cite:** [@eigaard2016]

      **Licence:** GPL (>= 3), as ramb; the values are those published in the article.

      **Changes:** compiled from the article for ramb (`data-raw/DATASET.R`); the standard errors and the number of
      observations of Table 4 added on 2026-10-16 (`data-raw/extdata.R`). Several numeric columns are stored as text, as
      they were compiled. The averages `av_kw`, `av_loa` and `av_fspeed` are unrounded; the article's Table 5 gives
      them rounded, with standard deviations that this table does not hold.
    source:
      parquet: benthis_parameters.parquet
    origin: https://github.com/einarhjorleifsson/ramb/blob/main/data-raw/DATASET.R
    columns:
      - name: benthis_metier
        type: string
        constraints: [primary_key]
        description: The BENTHIS gear group.
        examples: [DRB_MOL, OT_MIX, OT_MIX_DMF_PEL, SSC_DMF, TBB_MOL]
      - name: a
        type: number
        description: The model's first parameter (Eigaard et al. 2016, Table 4).
        examples: [0.3142, 0.9652, 5.1039, 10.6608, 4461.27]
      - name: b
        type: number
        description: The model's second parameter (Eigaard et al. 2016, Table 4).
        examples: [0.1176, 0.2921, 0.5078, 1.2454, 77.9812]
      - name: model
        type: enum
        description: The form of the model.
        values:
          linear: width = a × size + b
          power: width = a × size ^ b
      - name: variable
        type: enum
        description: The vessel size the model takes.
        values:
          avg_kw: engine power, kW
          avg_oal: length overall, m
      - name: subsurface_percentage
        type: string
        description: The share of the gear's footprint that reaches into the seabed, percent, stored as text.
        examples: ["0", "2.8", "29.2", "5", "8.6"]
      - name: id
        type: number(id)
        description: Row id.
        examples: [1, 4, 8, 11, 14]
      - name: av_kw
        type: string
        description: The average engine power of the group's vessels, kW, stored as text.
        examples: ["107.1773", "345.5205", "473.097", "690.3574", "883.8421"]
      - name: av_loa
        type: string
        description: The average length overall of the group's vessels, m, stored as text.
        examples: ["10.14545", "19.8", "21.685", "24.36896", "34.38526"]
      - name: av_fspeed
        type: string
        description: The average fishing speed of the group, knots, stored as text.
        examples: ["0", "2.5", "2.9", "3.008889", "5.230851"]
      - name: gear_width
        type: number(quantity)
        units: km
        description: >
          The gear width at the group's average vessel size: the model at `av_kw` or `av_loa`, in km. For OT_DMF,
          OT_MIX_CRU, OT_CRU and TBB_DMF it differs from the model at those averages by 2 to 28 percent, for reasons
          not recorded.
        range: [0.00493059313096151, 6.53664387674273]
      - name: contact_model
        type: string
        description: The model of the gear's contact with the seabed.
        examples: [danish_seine_contact, scottish_seine_contact, trawl_contact]
      - name: se_a
        type: number
        description: The standard error of `a` (Eigaard et al. 2016, Table 4).
        examples: [0.11, 0.2052, 1.8153, 10.6718, 1665.5023]
      - name: se_b
        type: number
        description: The standard error of `b` (Eigaard et al. 2016, Table 4).
        examples: [0.0347, 0.0598, 0.1061, 7.4518, 40.9298]
      - name: n_obs
        type: number(quantity)
        description: The number of observations the model was fitted to (Eigaard et al. 2016, Table 4).
        range: [7, 271]

