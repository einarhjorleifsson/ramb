      tracks: columns renamed, `FILE_NAME`, `SOURCE`, `PASSIVE_ACTIVE`, `COURSE`, `HEADING` and `QUALITY` left out,
      `op` added; its speed checked against the track: 0.96 of the speed from distance and time. Four times of two
      vessels appear twice, a few metres apart, and both rows are kept (`data-raw/wkssfgeo_examples.R`).
    source:
      parquet: wkssfgeo2_pt_gps.parquet
    origin: https://github.com/einarhjorleifsson/ramb/blob/main/data-raw/wkssfgeo_examples.R
