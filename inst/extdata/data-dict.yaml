  - name: benthis_parameters
    label: BENTHIS gear groups, gear width and seabed contact
    description: >
      Each row is one of 14 BENTHIS gear groups (eight otter trawl, three beam trawl, two demersal seine, one dredge):
      the model of gear width from vessel size, and the share of the gear's footprint that reaches into the seabed.
      Used by `rb_predict_gear_width()`.
    details: |
      **Cite:** [@eigaard2016]

      **Licence:** GPL (>= 3), as ramb; the values are those published in the article.

      **Changes:** compiled from the article for ramb (`data-raw/DATASET.R`); the standard errors and the number of
      observations of Table 4 added on 2026-10-16 (`data-raw/extdata.R`). Several numeric columns are stored as text, as
      they were compiled. The averages `av_kw`, `av_loa` and `av_fspeed` are unrounded; the article's Table 5 gives
      them rounded, with standard deviations that this table does not hold.
    source:
      parquet: benthis_parameters.parquet
    origin: https://github.com/einarhjorleifsson/ramb/blob/main/data-raw/DATASET.R
    columns:
      - name: benthis_metier
        type: string
        constraints: [primary_key]
        description: The BENTHIS gear group.
        examples: [DRB_MOL, OT_MIX, OT_MIX_DMF_PEL, SSC_DMF, TBB_MOL]
      - name: a
        type: number
        description: The model's first parameter (Eigaard et al. 2016, Table 4).
        examples: [0.3142, 0.9652, 5.1039, 10.6608, 4461.27]
      - name: b
        type: number
        description: The model's second parameter (Eigaard et al. 2016, Table 4).
        examples: [0.1176, 0.2921, 0.5078, 1.2454, 77.9812]
      - name: model
        type: enum
        description: The form of the model.
        values:
          linear: width = a × size + b
          power: width = a × size ^ b
      - name: variable
        type: enum
        description: The vessel size the model takes.
        values:
          avg_kw: engine power, kW
          avg_oal: length overall, m
      - name: subsurface_percentage
        type: string
        description: The share of the gear's footprint that reaches into the seabed, percent, stored as text.
        examples: ["0", "2.8", "29.2", "5", "8.6"]
      - name: id
        type: number(id)
        description: Row id.
        examples: [1, 4, 8, 11, 14]
      - name: av_kw
        type: string
        description: The average engine power of the group's vessels, kW, stored as text.
        examples: ["107.1773", "345.5205", "473.097", "690.3574", "883.8421"]
      - name: av_loa
        type: string
        description: The average length overall of the group's vessels, m, stored as text.
        examples: ["10.14545", "19.8", "21.685", "24.36896", "34.38526"]
      - name: av_fspeed
        type: string
        description: The average fishing speed of the group, knots, stored as text.
        examples: ["0", "2.5", "2.9", "3.008889", "5.230851"]
      - name: gear_width
        type: number(quantity)
        units: km
        description: >
          The gear width at the group's average vessel size: the model at `av_kw` or `av_loa`, in km. For OT_DMF,
          OT_MIX_CRU, OT_CRU and TBB_DMF it differs from the model at those averages by 2 to 28 percent, for reasons
          not recorded.
        range: [0.00493059313096151, 6.53664387674273]
      - name: contact_model
        type: string
        description: The model of the gear's contact with the seabed.
        examples: [danish_seine_contact, scottish_seine_contact, trawl_contact]
      - name: se_a
        type: number
        description: The standard error of `a` (Eigaard et al. 2016, Table 4).
        examples: [0.11, 0.2052, 1.8153, 10.6718, 1665.5023]
      - name: se_b
        type: number
        description: The standard error of `b` (Eigaard et al. 2016, Table 4).
        examples: [0.0347, 0.0598, 0.1061, 7.4518, 40.9298]
      - name: n_obs
        type: number(quantity)
        description: The number of observations the model was fitted to (Eigaard et al. 2016, Table 4).
        range: [7, 271]

  - name: metier5_benthis_lookup
    label: ICES metier level 5 to BENTHIS gear group
    description: Each row maps an ICES metier of level 5 to the BENTHIS gear group of `benthis_parameters`; 41 metiers.
    details: |
      **Cite:** [@eigaard2016]

      **Licence:** GPL (>= 3), as ramb.

      **Changes:** compiled for ramb after the article (`data-raw/DATASET.R`).
    source:
      parquet: metier5_benthis_lookup.parquet
    origin: https://github.com/einarhjorleifsson/ramb/blob/main/data-raw/DATASET.R
    columns:
      - name: metier5
        type: string
        constraints: [primary_key]
        description: ICES metier, level 5 (gear and target assemblage).
        examples: [DRB_CRU, OTB_MCF, OTT_MOL, SDN_CEP, TBB_MOL]
      - name: benthis_metier
        type: string
        description: The BENTHIS gear group.
        examples: [DRB_MOL, OT_MIX, OT_MIX_DMF_PEL, SSC_DMF, TBB_MOL]

  - name: wkssfgeo2_it_pots
    label: Italian pot vessel, labelled sets and hauls
    description: >
      Each row is a GPS position, every 60 s, of one Italian pot vessel on 13 trips, labelled setting, hauling or not
      fishing by the data's provider. Positions and dates are anonymised (the dates read 1979).
    details: |
      **Cite:** [@ices2023wkssfgeo2; @wkssfgeo2_github]

      **Licence:** MIT, Copyright (c) 2023 ICES Expert Groups.

      **Changes:** `data_examples/IT_CNR_2023_GP.csv` (CNR-IRBIM) of the WKSSFGEO2 repository, columns renamed, `op`
      added; trip 41 left out, being trip 40 an hour later (`data-raw/labelled_tracks.R`).
    source:
      parquet: wkssfgeo2_it_pots.parquet
    origin: https://github.com/einarhjorleifsson/ramb/blob/main/data-raw/labelled_tracks.R
    columns:
      - name: vid
        type: string
        description: The vessel, anonymised.
        examples: [VE_00003]
      - name: trip
        type: number(id)
        description: The source's trip number.
        examples: [34, 37, 40, 44, 47]
      - name: time
        type: datetime
        time_zone: naive
        description: Time of the position, anonymised.
        range: [1979-09-12T13:07:00, 1979-10-07T04:28:00]
      - name: lon
        type: number(quantity)
        units: degrees east
        description: Longitude, anonymised.
        range: [42.4811173527549, 42.8209016965645]
      - name: lat
        type: number(quantity)
        units: degrees north
        description: Latitude, anonymised.
        range: [56.5434551019669, 56.7547119126752]
      - name: speed
        type: number(quantity)
        units: knots
        description: Speed, knots, as the source gives it.
        range: [0, 17.2786177105832]
      - name: gear
        type: enum
        description: The gear.
        values:
          FPO: pots
      - name: label
        type: enum
        description: The provider's label, verbatim.
        values: [hauling, not_fishing, setting]
      - name: op
        type: enum
        description: '"set" or "haul" where `label` says so, else null.'
        values: [haul, set]

  - name: wkssfgeo_pt_gps
    label: Portuguese pot and dredge vessels, labelled
    description: >
      Each row is a GPS-tracker position of one of five small-scale vessels in the south of Portugal, March 2017: two
      with pots (octopus traps), three with bivalve dredges. Some tracks were labelled by an expert.
    details: |
      **Cite:** [@ices2022wkssfgeo; @wkssfgeo_github]

      **Licence:** MIT, Copyright (c) 2021 ICES Expert Groups.

      **Changes:** `data-examples/example_data_GPS.csv` of the WKSSFGEO repository, columns renamed, `op` added
      (`data-raw/labelled_tracks.R`).
    source:
      parquet: wkssfgeo_pt_gps.parquet
    origin: https://github.com/einarhjorleifsson/ramb/blob/main/data-raw/labelled_tracks.R
    columns:
      - name: vid
        type: string
        description: The vessel, anonymised.
        examples: [id_Ala, id_Ben, id_Car, id_Hum, id_Sou]
      - name: trip
        description: Always null; the source has no trips.
      - name: time
        type: datetime
        time_zone: naive
        description: Time of the position, as given; the source states no zone.
        range: [2017-03-10T06:06:01, 2017-03-14T09:30:17]
      - name: lon
        type: number(quantity)
        units: degrees east
        description: Longitude.
        range: [-8.1744571, -7.5685898]
      - name: lat
        type: number(quantity)
        units: degrees north
        description: Latitude.
        range: [36.9571306, 37.111947]
      - name: speed
        type: number(quantity)
        units: knots
        description: Speed, knots, as the source gives it.
        range: [0.539956986904144, 10.7991399765015]
      - name: gear
        type: enum
        description: The gear.
        values:
          dredge: bivalve dredge
          pots: octopus traps
      - name: label
        type: enum
        description: The expert's label, verbatim; null where the track was not labelled.
        values: [hauling, run, set, tow, travel]
      - name: op
        type: enum
        description: '"set" or "haul" where `label` says so, else null.'
        values: [haul, set]

  - name: ird_mg_gillnet
    label: Malagasy drive-in gillnet fishers, labelled
    description: >
      Each row is a GPS position, every 60 s, of one of four fishers using drive-in gillnets in a small-scale reef
      fishery in south-west Madagascar, January to July 2017, labelled by an observer on board.
    details: |
      **Cite:** [@etienne2020; @behivoke2021]

      **Licence:** CC BY 4.0.

      **Changes:** `Supplementary material2_Data_gillnet.Rdata` of the dataset: columns selected and renamed, speed
      from its distance per minute, `op` added (`data-raw/labelled_tracks.R`).
    source:
      parquet: ird_mg_gillnet.parquet
    origin: https://github.com/einarhjorleifsson/ramb/blob/main/data-raw/labelled_tracks.R
    columns:
      - name: vid
        type: string
        description: The fisher (village, gear and fisher codes).
        examples: [L_FM_P001, L_FM_P002, L_FM_P003, L_FM_P004]
      - name: trip
        type: number(id)
        description: The source's trip number (`no_trajet`).
        examples: [8, 26, 44, 58, 74]
      - name: time
        type: datetime
        time_zone: naive
        description: Time of the position, as given (`date_heure`); the source states no zone.
        range: [2017-01-17T05:10:02, 2017-07-08T11:16:38]
      - name: lon
        type: number(quantity)
        units: degrees east
        description: Longitude.
        range: [43.6824049333333, 43.756248]
      - name: lat
        type: number(quantity)
        units: degrees north
        description: Latitude.
        range: [-23.514107, -23.426575]
      - name: speed
        type: number(quantity)
        units: knots
        description: Speed, knots, from the source's distance per minute.
        range: [0, 10.7152497800216]
      - name: gear
        type: enum
        description: The gear.
        values:
          FM: gillnet (filet maillant)
      - name: label
        type: string
        description: >
          The observer's label, verbatim, in French (e.g. Pose_filet: the net set; Remonter_filet: the net hauled;
          Rabattage_poisson: fish driven into it); spelling as recorded.
        examples: [Pose_filet, Rabattage_poisson, Remonter_filet, Recherche_bon_endroit, Retour]
      - name: op
        type: enum
        description: '"set" or "haul" where `label` says so, else null.'
        values: [haul, set]
