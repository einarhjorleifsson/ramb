        description: The vessel.
        examples: [1]
      - name: tid
        type: number(id)
        description: The trip.
        examples: [1]
      - name: lon
        type: number(quantity)
        units: degrees east
        description: Longitude.
        range: [-25.04, -24.5]
      - name: lat
        type: number(quantity)
        units: degrees north
        description: Latitude.
        range: [62, 62.2]
