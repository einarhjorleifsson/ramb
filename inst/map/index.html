<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map</title>
<!-- ramb's map viewer (rb_map(), rb_map_serve()): the engine. What it shows comes from its config, which the server
     writes into the script tag "config" below as it serves the page. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
  /* a sidebar of groups that fold, each layer with its info and, when ticked, its controls and legend under it
     (after vefsja.is); behind a menu button on a phone */
  :root { --side: 310px; --bar: #2c5d87; --bar-hover: #234b6d; --line: #dde2e7; --muted: #5f6b76; }
  html, body { margin: 0; height: 100%; font: 13px/1.35 system-ui, sans-serif; color: #222; background: #fff; }
  #side { position: absolute; top: 0; bottom: 0; left: 0; width: var(--side); z-index: 3; background: #fff;
          box-shadow: 1px 0 5px rgba(0,0,0,.2); display: flex; flex-direction: column; }
  #map { position: absolute; top: 0; bottom: 0; left: var(--side); right: 0; }
  #side header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #side header h1 { font-size: 15px; margin: 0; flex: 1; }
  #groups { flex: 1; overflow-y: auto; scrollbar-gutter: stable; }   /* a scrollbar appearing moves nothing */
  details.group > summary { list-style: none; cursor: pointer; background: var(--bar); color: #fff; padding: 7px 12px;
                            border-bottom: 1px solid #fff; user-select: none; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary::before { content: "▸"; display: inline-block; width: 1.1em; transition: transform .15s; }
  details.group[open] > summary::before { transform: rotate(90deg); }
  details.group > summary:hover { background: var(--bar-hover); }
  .body { padding: 6px 12px 10px; }
  .layer + .layer { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 4px; }
  .layer .head { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .layer .head label { font-weight: 600; }
  .layer .head .count { flex: 1; color: var(--muted); }
  .info-btn { border: 0; background: none; color: var(--bar); cursor: pointer; padding: 0 2px; font-size: 15px; }
  .info { color: #333; background: #f3f5f7; border-radius: 4px; padding: 6px 8px; margin: 2px 0 6px; }
  .layer.off .when-on { display: none; }
  .sub { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 2px; }
  .row { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
  .row[hidden] { display: none; }
  .choose { padding: 4px 12px 6px; border-bottom: 1px solid var(--line); }
  .choose .row button { padding: 1px 7px; }
  .choose .chips { display: flex; flex-wrap: wrap; gap: 1px 10px; margin: -2px 0 4px 80px; }
  .choose .chips label { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); }
  .row label { width: 74px; color: var(--muted); }
  .row select, .row input[type=range] { flex: 1; min-width: 0; }
  .row.colours input[type=color] { width: 34px; height: 22px; padding: 0; border: 1px solid #c8ccd0; background: none; }
  .row.colours label + input + label { width: auto; margin-left: 10px; }
  .row label.auto { width: auto; margin-left: 10px; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
  .years select { flex: 1; }
  .range .val { width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 2px 8px; }
  .legend { margin-top: 8px; }
  .bar { height: 10px; border-radius: 2px; }
  #hist { display: block; width: 100%; height: 44px; margin-top: 2px; }
  .ends { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
  #status { color: #777; padding: 6px 12px; border-top: 1px solid var(--line); min-height: 1.3em; }
  .about p { margin: 4px 0 8px; }
  #bases label { display: flex; align-items: center; gap: 6px; margin: 3px 0; cursor: pointer; }
  .swatches { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 4px 22px; color: var(--muted); }
  .swatches span { display: inline-flex; align-items: center; gap: 5px; }
  .swatches i { display: inline-block; width: 14px; height: 10px; }
  #copylink { border: 0; background: none; cursor: pointer; font-size: 15px; padding: 0 4px; }
  .langs button { border: 1px solid var(--line); background: #fff; color: var(--muted); padding: 1px 6px; cursor: pointer; }
  .langs button + button { border-left: 0; }
  .langs button.on { background: var(--bar); border-color: var(--bar); color: #fff; }
  #menu, #close { display: none; }
  /* the time panel (rb_map_time()): under the map, beside the sidebar */
  :root { --timeh: clamp(230px, 36vh, 360px); }
  body.has-time #map { bottom: var(--timeh); }
  #timep { position: absolute; left: var(--side); right: 0; bottom: 0; height: var(--timeh); z-index: 2; background: #fff;
           border-top: 1px solid var(--line); display: flex; flex-direction: column; }
  #timep[hidden] { display: none; }
  /* its controls are in the sidebar's group "Time"; over the chart only the readout, in the chart's top padding */
  #t-cols { flex: 1; display: flex; flex-wrap: wrap; gap: 2px 12px; }
  #t-cols label { width: auto; display: inline-flex; align-items: center; gap: 4px; }
  #t-info { position: absolute; top: 3px; left: 10px; right: 10px; z-index: 1; pointer-events: none; color: #222;
            font-size: 12px; line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            font-variant-numeric: tabular-nums; }
  #t-chart { flex: 1; min-height: 0; overflow: hidden; }
  #t-lanes { display: block; width: 100%; flex: none; cursor: pointer; }
  @media (max-width: 700px) {
    #map { left: 0; }
    #side { width: min(330px, 90vw); transform: translateX(-105%); transition: transform .2s; }
    body.side-open #side { transform: none; }
    #timep { left: 0; }
    #menu { display: block; position: absolute; top: 10px; left: 10px; z-index: 2; font-size: 18px; line-height: 1;
            padding: 6px 10px; background: #fff; border: 0; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    #close { display: block; border: 0; background: none; font-size: 18px; cursor: pointer; }
  }
</style>
</head>
<body>
<div id="map"></div>
<section id="timep" hidden>
  <div id="t-info"></div>
  <div id="t-chart" data-tt="tDrag"></div>
  <canvas id="t-lanes" height="0"></canvas>
</section>
<button id="menu" data-tt="menu">☰</button>
<aside id="side">
  <header><h1></h1>
    <button id="copylink" data-tt="copyLink">🔗</button>
    <span class="langs"></span>
    <button id="close" data-tt="close">✕</button></header>
  <div id="groups">
    <!-- the time panel's controls (rb_map_time()), shown when the map has one -->
    <details class="group" id="g-time" open hidden>
      <summary data-t="gTime"></summary>
      <div class="body">
        <div class="row"><label for="t-vessel" data-t="tVessel"></label><select id="t-vessel"></select></div>
        <div class="row"><label for="t-span" data-t="tSpan"></label><select id="t-span"></select></div>
        <div class="row" id="t-cols-row" hidden><label data-t="tCols"></label><span id="t-cols"></span></div>
        <div class="row"><button id="t-whole" data-t="tWholeBtn" data-tt="tWholeTip"></button></div>
      </div>
    </details>
    <details class="group" id="g-base">
      <summary data-t="gBase"></summary>
      <div class="body" id="bases"></div>
    </details>
    <details class="group about" id="g-about">
      <summary data-t="gAbout"></summary>
      <div class="body" id="about"></div>
    </details>
  </div>
  <div id="status"></div>
</aside>
<!-- a grid layer's colour controls and legend, put under its filters -->
<template id="grid-colour">
  <div class="sub" data-t="colour"></div>
  <div class="row"><label for="palette" data-t="colours"></label><select id="palette"></select></div>
  <div class="row"><label for="stretch" data-t="stretch"></label>
    <select id="stretch" data-tt="stretchTip">
      <option value="even" data-t="sEven"></option>
      <option value="equal" data-t="sEqual"></option>
    </select></div>
  <div class="row range"><label for="lo" data-t="floor"></label><input id="lo" type="range" min="-4" max="5" step="any"><span class="val" id="loval"></span></div>
  <div class="row range"><label for="hi" data-t="cap"></label><input id="hi" type="range" min="-4" max="5" step="any"><span class="val" id="hival"></span></div>
  <div class="row range"><label for="opacity" data-t="opacity"></label><input id="opacity" type="range" min="0" max="100" step="1"><span class="val" id="opval"></span></div>
  <div class="row"><button id="fit" data-t="fit" data-tt="fitTip"></button></div>
  <div class="legend" data-tt="legendTip">
    <div class="bar" id="bar"></div><canvas id="hist"></canvas><div class="ends"><span id="lolab"></span><span id="midlab"></span><span id="hilab"></span></div></div>
</template>
<script id="config" type="application/json">__CONFIG__</script>
<script id="bundle" type="application/json">__BUNDLE__</script>
<script>
// The engine's version: rb_map_serve() sends its own in /meta, and a server older than the page is named as such
const ENGINE = 3;
// The engine's texts, in English; a config adds languages and the texts of its layers ({1}, {2} filled in here)
const ENGINE_TEXTS = {
  menu: "Layers and filters", close: "Close", copyLink: "Copy a link to this view", copied: "link copied",
  notCopied: "the browser refused to copy the link", infoTip: "About this layer", gBase: "Base map", gAbout: "About",
  shMethod: "Shading", shStandard: "standard", shBasic: "basic", shCombined: "combined", shIgor: "igor (soft)",
  shMulti: "several lights", shDirection: "Light from", shAltitude: "Light height", shIntensity: "Intensity",
  shShadow: "Shadow", shHighlight: "Light",
  cScale: "Scale", cLog: "log", cLinear: "linear", cMode: "Colours as", cRamp: "a ramp", cBands: "bands",
  cCut: "Shallower than", cNone: "none", cCutAs: "drawn", cClear: "clear", cGrey: "grey",
  cFitTip: "Floor and cap at the 2nd and 98th percentiles of the values in view", cFitNone: "no values in view to fit to",
  cEqual: "equal shares", cAuto: "follow the view", kAuto: "levels from the view",
  kAutoTip: "About a dozen lines at round values near the view's quantiles, so they fall where the area is; unticked, the fixed spacing",
  sAuto: "intensity from the view", sAutoTip: "The intensity fitted to the view's relief each time the map settles: stronger where the seabed is gentle; setting it by hand stops it", cAutoTip: "Fit the floor and cap to the view each time it settles; setting either by hand stops it",
  loading: "loading tiles…", zoom: "zoom", refused: "the server refused tiles (HTTP {1})",
  older: "the server is an older version ({1}) than this page ({2}): restart it", colour: "Colour",
  colours: "Colours", stretch: "Stretch", stretchTip: "How the colours are spread between floor and cap",
  sEven: "even on a log scale", sEqual: "equal shares of the cells in view", floor: "Floor", cap: "Cap",
  opacity: "Opacity", fit: "Fit to view", fitTip: "Floor and cap at the 2nd and 98th percentiles of the cells in view",
  chooseAll: "all", chooseAllTip: "Show every value", chooseBack: "The previous one", chooseNext: "The next one",
  legendTip: "The colour scale on a log axis, and below it the cells in view: values below the floor and above the cap in the end bars",
  yes: "yes", no: "no",
  gTime: "Time", tVessel: "Vessel", tSpan: "Span", tCols: "Columns", tWholeBtn: "Whole span", tWholeTip: "Show the whole span; a double click on the chart does the same",
  tWhole: "whole ({1})", tLoading: "loading the vessel's pings…", tFailed: "the pings did not come: {1}",
  tWindow: "{1} to {2}{3} · {4} pings", tThinned: "1 in {1} drawn on the map", tNone: "no pings in this span",
  tDrag: "Drag across the chart to choose a time; double click for the whole span"

let CONFIG;
try { CONFIG = JSON.parse(document.getElementById("config").textContent); }
catch (err) {
  document.body.innerHTML = "<p style='padding:2em'>The server did not send the page's config: restart it (an older " +
                            "server may be running).</p>";
  throw err;
}
// the engine's texts, then the base maps' labels (key b_<id>), then the config's texts over both
const PALETTES = CONFIG.palettes, BASEMAPS = CONFIG.basemaps;
const T = {};
const addText = (k, v) => { T[k] = { ...T[k], ...(typeof v === "string" ? { en: v } : v) }; };
for (const [k, v] of Object.entries(ENGINE_TEXTS)) addText(k, v);
for (const b of BASEMAPS) addText("b_" + b.id, b.label ?? b.id);
for (const [k, v] of Object.entries(CONFIG.texts ?? {})) addText(k, v);
const LANGS = CONFIG.languages ?? ["en"];
const LAYERS = CONFIG.layers, OTHER = LAYERS.filter(l => l.kind !== "grid");
const G = LAYERS.find(l => l.kind === "grid");   // one grid layer at most, with the colour controls
const SOURCES = new Set(LAYERS.map(l => l.id));    // each layer's source is named by its id
const DEM = new Set(LAYERS.filter(l => l.kind === "dem").map(l => l.id));   // elevations, drawn under a grid
const CONTOUR = new Set(LAYERS.filter(l => l.kind === "contour").map(l => l.id));   // over them, under the labels
// The time panel (rb_map_time()), if the map has one; its sources are the page's, kept over a change of base map
const TP = CONFIG.time ?? null;
let TS = null, TU = null, TW = null;   // the vessel's span as loaded, its chart, and the window [from, to] in seconds
if (TP) for (const id of ["rb-time-line", "rb-time-pts", "rb-time-hover"]) SOURCES.add(id);
// A bundle (rb_map_bundle()): the page opened as a file, with no server. Its meta is here; its tiles and data are script
// files beside it, each handing its value to RB_BUNDLE(), since a page opened as a file may load a script where it may
// not fetch(). Tiles go to MapLibre through the bundle:// protocol; layers on the same tiles share their folder
const BUNDLE = JSON.parse(document.getElementById("bundle")?.textContent || "null");
const bundleWait = {};
window.RB_BUNDLE = (key, v) => { if (bundleWait[key]) bundleWait[key].v = v; };
function bundleLoad(key) {
  bundleWait[key] ??= { p: new Promise((resolve, reject) => {
    const s = document.createElement("script");
    const done = () => {
      s.remove();
      const w = bundleWait[key];
      delete bundleWait[key];
      if (w && "v" in w) resolve(w.v); else reject(new Error("not in the bundle: " + key));
    };
    s.onload = done; s.onerror = done;
    s.src = key + ".js";
    document.head.append(s);
  }) };
  return bundleWait[key].p;
}
const fromBase64 = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; };
const bundleTiles = l => `tiles/${BUNDLE.tiles?.[l.id] ?? l.id}`;
if (BUNDLE) maplibregl.addProtocol("bundle", async p => ({ data: fromBase64(await bundleLoad(p.url.slice("bundle://".length))) }));
// a layer's tiles: the server's, or the bundle's
const layerTiles = (l, ext, v) => BUNDLE ? `bundle://${bundleTiles(l)}/{z}/{x}/{y}` : `${location.origin}/tiles/${l.id}/{z}/{x}/{y}.${ext}?v=${v}`;
// A bundle's grid (rb_map_bundle()'s `grids`): its rows by cell at a few cell sizes, in blocks of cells. Each tile the
// map asks for is made here, as its server would: the blocks under it at the size that makes a cell one to two screen
// pixels (the `px` filter times that), their rows kept by the filters in the tile's address and summed by cell, sent
// as a vector tile with the server's fields. The blocks read are kept, 256 MB at most, the least recently used let go
const GRID = (G && BUNDLE?.grids?.[G.id]) || null;
const gridBlocks = new Map();
let gridBytes = 0;
function gridBlock(L, b) {
  const key = `grids/${G.id}/${L}/${b}`, hit = gridBlocks.get(key);
  if (hit) { gridBlocks.delete(key); gridBlocks.set(key, hit); return hit.p; }
  const e = {};
  e.p = bundleLoad(key).then(async s => {
    const buf = await new Response(new Blob([fromBase64(s)]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();
    const n = new DataView(buf).getUint32(0, true);
    let o = 4;
    const sums = GRID.sums.map(() => { const a = new Float32Array(buf, o, n); o += 4 * n; return a; });
    const cell = new Uint16Array(buf, o, n), codes = {};
    o += 2 * n;
    for (const c of GRID.columns) if (c.bytes === 2) { codes[c.id] = new Uint16Array(buf, o, n); o += 2 * n; }
    for (const c of GRID.columns) if (c.bytes === 1) { codes[c.id] = new Uint8Array(buf, o, n); o += n; }
    e.bytes = buf.byteLength;
    gridBytes += e.bytes;
    for (const [k, v] of gridBlocks) {
      if (gridBytes <= 256e6 || v === e) break;
      if (v.bytes) { gridBlocks.delete(k); gridBytes -= v.bytes; }
    }
    return { n, sums, cell, codes };
  }).catch(err => { gridBlocks.delete(key); throw err; });

  return e.p;
}
async function gridTile(url) {
  const m = url.match(/\/(\d+)\/(\d+)\/(\d+)(?:\?(.*))?$/), z = +m[1], x = +m[2], y = +m[3], q = new URLSearchParams(m[4] ?? "");
  const px = Math.max(0.25, +(GRID.px ? q.get(GRID.px) : 1) || 1);
  const target = 360 / 2 ** z / 512 * px / GRID.unit * 2;
  const L = [...GRID.levels].reverse().find(l => l <= target) ?? GRID.levels[0];
  const side = L * GRID.unit, n = 2 ** z, B = GRID.block, S = GRID.sums.length;
  const lon0 = x / n * 360 - 180, lon1 = (x + 1) / n * 360 - 180;
  const latOf = t => Math.atan(Math.sinh(Math.PI * (1 - 2 * t / n))) * 180 / Math.PI;
  const lat0 = latOf(y + 1), lat1 = latOf(y);
  const cx0 = Math.floor(lon0 / side) - 1, cx1 = Math.floor(lon1 / side) + 1;
  const cy0 = Math.floor(lat0 / side) - 1, cy1 = Math.floor(lat1 / side) + 1;
  const W = cx1 - cx0 + 1, H = cy1 - cy0 + 1;

  // empty value all of them, or a filter with no "all" its default
  const keep = GRID.columns.map(c => {
    const f = G.filters.find(g => g.id === c.id);
    if (c.range) {
      const [p1, p2] = f.params;
      if (!q.has(p1) || !q.has(p2)) return null;
      const a = Math.min(+q.get(p1), +q.get(p2)), b = Math.max(+q.get(p1), +q.get(p2));
      return Uint8Array.from(c.values, v => v !== null && +v >= a && +v <= b);
    }

    if (v === "" && !f.meta && !(f.options ?? []).some(o => o.value === "")) v = String(f.default ?? f.options?.[0]?.value ?? "");
    if (v === "") return null;
    const set = new Set(v.split(","));

    for (let by = Math.floor(cy0 / B); by <= Math.floor(cy1 / B); by++) if (want.has(`${bx}_${by}`)) jobs.push([bx, by]);

    const ox = jobs[j][0] * B - cx0, oy = jobs[j][1] * B - cy0;

      if (gx < 0 || gx >= W || gy < 0 || gy >= H) continue;
      let pass = true;
      for (const [codes, mask] of tests) if (!mask[codes[i]]) { pass = false; break; }
      if (!pass) continue;
      const at = gy * W + gx;
      seen[at] = 1;
      for (let s = 0; s < S; s++) acc[at * S + s] += b.sums[s][i];
    }
  });

  const ext = 4096, clamp = v => Math.max(-64, Math.min(ext + 64, v));
  const merc = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)), mN = merc(lat1), mS = merc(lat0);
  const tx = lon => clamp(Math.round((lon - lon0) / (lon1 - lon0) * ext)), ty = lat => clamp(Math.round((mN - merc(lat)) / (mN - mS) * ext));
  const names = Object.keys(GRID.fields), from = names.map(k => [GRID.sums.indexOf(GRID.fields[k][0]), GRID.fields[k][1] === "km2"]);
  const feats = [];
  for (let gy = 0; gy < H; gy++) {
    const la0 = (cy0 + gy) * side, la1 = la0 + side, top = ty(la1), bottom = ty(la0);
    if (top === bottom) continue;
    const km2 = side * 111.32 * Math.cos((la0 + la1) / 2 * Math.PI / 180) * side * 110.574;
    for (let gx = 0; gx < W; gx++) {

      if (!seen[at]) continue;

}
// A vector tile of one layer of rectangles, each [left, top, right, bottom, values] in tile units, its values doubles
function pbfWriter() {

    reset() { pos = 0; },
    varint(v) { grow(10); while (v > 127) { buf[pos++] = (v % 128) | 128; v = Math.floor(v / 128); } buf[pos++] = v; },
    double(v) { grow(8); new DataView(buf.buffer).setFloat64(pos, v, true); pos += 8; },
    field(tag, bytes) { w.varint(tag); w.varint(bytes.length); grow(bytes.length); buf.set(bytes, pos); pos += bytes.length; },
    view() { return buf.subarray(0, pos); }
  };

}

  histVals = map.queryRenderedFeatures({ layers: [G.id] }).map(f => +f.properties[metric()]).filter(x => x > 0).map(Math.log10);
  // an equal stretch with a floor and cap from the address has no fit to take its shares from: the first view gives them
  if (!viewVals.length && histVals.length >= 10) { viewVals = [...histVals].sort((a, b) => a - b); paint(); }
  drawHist();
}

map.on("idle", () => {
  sampleView();
  $("status").textContent = tileError || zoomText();
  // the first fit waits for cells to fit to: a page opened with the grid off fits when it is turned on
  if (G && !fitted && map.getLayer(G.id) && $(G.id).checked) fitted = fitToView();
});

if (G) {
  // the grid's popup, registered after the other layers': a feature over the cell has spoken
  map.on("click", G.id, e => {
    if (e.originalEvent.featureShown) return;
    const p = e.features[0].properties, fs = G.popup?.fields ?? [];
    const v = f => f.format === "count" ? (+p[f.field]).toLocaleString(loc()) : fmt(+p[f.field]);
    popup?.remove();
    popup = new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat)
      .setHTML(fs.map((f, i) => i === 0 ? `<b>${v(f)}</b> ${tr(f.label)}` : `${v(f)} ${tr(f.label)}`).join("<br>"))
      .addTo(map);
  });
  map.on("mouseenter", G.id, () => { map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", G.id, () => { map.getCanvas().style.cursor = ""; });
}

// The time panel (rb_map_time()) ---------------------------------------------------------------------------------------
// One vessel's span held whole in the page: its columns over time in a chart (uPlot), its marks and lanes, and on the
// map the window's track and pings. A drag across the chart sets the window, a double click shows the whole span; a
// hover marks the ping on the map, a click on a ping of the window marks its time on the chart. The map's window is
// drawn as new data each time: a filter on a big source re-tiles it (0.3 s on 150,000 pings, fishycode plan 064 step
// 1) where new data of a day take 17 ms, so the window's pings are thinned to T_MAX, a marked one always kept.
// pings drawn at most; a silence that breaks the line (s; rb_map_time(max_gap_s = ), none by default); a lane's height
const T_MAX = 5000, T_GAP = TP?.max_gap_s ?? Infinity, LANE_H = 20;
const T_COLS = ["#2c5d87", "#d95f02", "#1b9e77", "#7570b3", "#e7298a", "#66a61e"];   // the page's blue, then Dark2
const T_MARK = "#e31a1c", LANE_FILL = ["#d9dde1", "#c4c9ce"];
const LANE_PAL = ["#b3cde3", "#ccebc5", "#fed9a6", "#decbe4", "#fbb4ae", "#ffffcc", "#e5d8bd", "#fddaec"];   // Pastel1
const INFERNO9 = ["#040404", "#2D1243", "#611163", "#961474", "#C53270", "#EB5C4C", "#F69422", "#F8C952", "#FFFE9E"];
const EMPTY = { type: "FeatureCollection", features: [] };
let uplotLib = null, tSeq = 0, tFrame = 0, tPinned = null;   // tPinned: a ping clicked on the map, until the pointer moves
// uPlot, pinned as MapLibre is, loaded only for a map with a time panel
const loadUplot = () => uplotLib ??= new Promise((resolve, reject) => {
  const c = document.createElement("link");
  c.rel = "stylesheet"; c.href = "https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.min.css";
  document.head.append(c);
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.iife.min.js";
  s.onload = () => window.uPlot ? resolve(window.uPlot) : reject(new Error("uPlot"));
  s.onerror = reject;
  document.head.append(s);
});
// a time in seconds as the data hold it, in no zone
const tTime = (s, sec = false) => Number.isFinite(s) ? new Date(s * 1000).toISOString().slice(0, sec ? 19 : 16).replace("T", " ") : "";
const tNum = v => v == null ? "–" : (+(+v).toPrecision(4)).toLocaleString(loc());
const tVes = () => TP.vessels.find(v => v.value === $("t-vessel").value) ?? TP.vessels[0];
// the first index at or after a (after = true: the first after a) in the span's times, which are sorted
function tFind(a, after = false) {
  const t = TS.t;
  let lo = 0, hi = t.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (after ? t[m] <= a : t[m] < a) lo = m + 1; else hi = m; }
  return lo;
}

function timeSetup(q) {
  document.body.classList.add("has-time");
  $("timep").hidden = false;
  tLayers();
  tVessels();
  const v0 = TP.vessels.find(v => v.value === q.get("tv")) ?? TP.vessels[0];
  $("t-vessel").value = v0.value;
  tSpans(v0, q.get("tspan"));
  if (TP.cols.length > 1) {
    $("t-cols-row").hidden = false;
    TP.cols.forEach((c, i) => $("t-cols").insertAdjacentHTML("beforeend",
      `<label><input type="checkbox" data-col="${i}" aria-label="${esc(tr(c.label))}"${i ? "" : " checked"}><span style="color:${T_COLS[i % T_COLS.length]}">${esc(tr(c.label))}</span></label>`));
  }
  $("t-vessel").addEventListener("change", () => { tSpans(tVes()); tLoad(); });
  $("t-span").addEventListener("change", () => tLoad());
  $("t-whole").addEventListener("click", () => tSetWindow(null));
  $("t-cols").addEventListener("change", e => TU?.setSeries(+e.target.dataset.col + 1, { show: e.target.checked }));
  $("t-lanes").style.height = `${TP.lanes.length * LANE_H}px`;
  $("t-lanes").addEventListener("click", e => { const h = tLaneAt(e); if (h) tSetWindow(h.pad); });
  $("t-lanes").addEventListener("mousemove", e => {
    const h = tLaneAt(e);
    $("t-lanes").title = h ? `${tr(h.lane.label)}: ${h.label ?? ""} ${tTime(h.t0)} to ${tTime(h.t1)}` : "";
  });
  new ResizeObserver(() => TU?.setSize({ width: $("t-chart").clientWidth, height: $("t-chart").clientHeight })).observe($("t-chart"));
  // a click near a ping of the window (within 8 px: a ping is a small target) marks its time on the chart
  map.on("click", e => {
    if (!TU || !map.getLayer("rb-time-dot")) return;
    const { x, y } = e.point, fs = map.queryRenderedFeatures([[x - 8, y - 8], [x + 8, y + 8]], { layers: ["rb-time-dot"] });
    let i = null, best = Infinity;
    for (const f of fs) {
      const p = map.project(f.geometry.coordinates), d = (p.x - x) ** 2 + (p.y - y) ** 2;
      if (d < best) { best = d; i = f.properties.i; }
    }
    if (i == null) return;
    e.originalEvent.featureShown = true;
    // the cursor on that very ping: at a coarse window several pings share a pixel, which the chart would snap among
    const yv = TS.y[TP.cols[0].field][i];
    tPinned = i;
    TU.setCursor({ left: TU.valToPos(TS.t[i], "x"), top: yv == null ? 0 : TU.valToPos(yv, "y0") });
  });
  map.on("mouseenter", "rb-time-dot", () => { map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", "rb-time-dot", () => { map.getCanvas().style.cursor = ""; });
  const w = (q.get("tw") ?? "").split(",").map(Number);
  tLoad(w.length === 2 && w.every(Number.isFinite) && w[0] < w[1] ? w : null);
}
// the vessels and spans to choose from, their counts in the page's language
function tVessels() {
  const v = $("t-vessel").value;
  $("t-vessel").replaceChildren(...TP.vessels.map(x => new Option(`${x.value} (${x.n.toLocaleString(loc())})`, x.value)));
  if (v) $("t-vessel").value = v;
}
function tSpans(v, want = null) {
  const s = want ?? $("t-span").value;
  $("t-span").replaceChildren(...v.spans.map(x => new Option(
    x.value === "all" ? tr("tWhole", x.n.toLocaleString(loc())) : `${x.value} (${x.n.toLocaleString(loc())})`, x.value)));
  $("t-span").value = v.spans.some(x => x.value === s) ? s : v.span;
}
function timeLang() { tVessels(); tSpans(tVes()); tInfo(); TU?.redraw(false, false); }

// the window's track, its pings (coloured by the first column, a mark ringed) and the ping under the cursor, over every
// other layer; the line drawn twice, dark under light, so it shows on any base map
function tLayers() {
  map.addSource("rb-time-line", { type: "geojson", data: EMPTY });
  map.addSource("rb-time-pts", { type: "geojson", data: EMPTY });
  map.addSource("rb-time-hover", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "rb-time-case", type: "line", source: "rb-time-line",
                 paint: { "line-color": "#000", "line-width": 3.5, "line-opacity": 0.45 } });
  map.addLayer({ id: "rb-time-line", type: "line", source: "rb-time-line",
                 paint: { "line-color": "#fff", "line-width": 1.5, "line-opacity": 0.9 } });
  map.addLayer({ id: "rb-time-dot", type: "circle", source: "rb-time-pts",
                 paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 6, 1.5, 12, 3.5],
                          "circle-color": "#808080", "circle-stroke-color": "#fff",
                          "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 9, 0, 11, 0.6] } });
  map.addLayer({ id: "rb-time-mark", type: "circle", source: "rb-time-pts", filter: ["has", "mk"],
                 paint: { "circle-radius": 7, "circle-opacity": 0, "circle-stroke-color": T_MARK, "circle-stroke-width": 2 } });
  map.addLayer({ id: "rb-time-hover", type: "circle", source: "rb-time-hover",
                 paint: { "circle-radius": 9, "circle-opacity": 0, "circle-stroke-color": "#000", "circle-stroke-width": 5 } });
  map.addLayer({ id: "rb-time-hover-in", type: "circle", source: "rb-time-hover",
                 paint: { "circle-radius": 9, "circle-opacity": 0, "circle-stroke-color": "#fff", "circle-stroke-width": 2.5 } });
}

// One vessel's span from the server, or from the bundle's file for it; a later choice wins over an earlier one
async function tLoad(win = null) {
  const v = tVes(), span = $("t-span").value, seq = ++tSeq;
  $("t-info").textContent = tr("tLoading");
  let d;
  try {
    d = BUNDLE ? await bundleLoad(`time/${TP.vessels.indexOf(v)}_${span}`)
               : await fetch(`/time?v=${encodeURIComponent(v.value)}&span=${encodeURIComponent(span)}`)
                   .then(async r => r.ok ? r.json() : Promise.reject(new Error(await r.text())));
  } catch (err) {
    if (seq === tSeq) $("t-info").textContent = tr("tFailed", err?.message ?? err);
    return;
  }
  if (seq !== tSeq) return;
  TS = d;
  // each ping's mark: the label of the first mark column that holds it
  TS.mk = new Array(d.t.length).fill(null);
  for (const m of TP.marks) {
    const k = d.marks?.[m.field];
    if (k) k.i.forEach((i, j) => { TS.mk[i] ??= `${tr(m.label)}: ${k.v[j]}`; });
  }
  // the first column's colours, over its 1st to 99th percentile in the span
  const y0 = d.y[TP.cols[0].field].filter(Number.isFinite).sort((a, b) => a - b);
  TS.lo = y0[Math.floor(0.01 * (y0.length - 1))] ?? 0;
  TS.hi = y0[Math.floor(0.99 * (y0.length - 1))] ?? 1;
  if (!(TS.hi > TS.lo)) TS.hi = TS.lo + 1;
  map.setPaintProperty("rb-time-dot", "circle-color", ["case", ["has", "v"],
    ["interpolate", ["linear"], ["get", "v"], ...INFERNO9.flatMap((c, j) => [TS.lo + (TS.hi - TS.lo) * j / 8, c])], "#808080"]);
  await tChart();
  tSetWindow(win);
}

async function tChart() {
  const uPlot = await loadUplot();
  TU?.destroy();
  TU = null;
  const el = $("t-chart");
  if (!TS.t.length) { $("t-info").textContent = tr("tNone"); return; }
  // a silence longer than T_GAP breaks the line, as the map's and the lanes' runs
  const gaps = (u, sidx, i0, i1, nullGaps) => {
    const t = u.data[0], g = [...nullGaps];
    for (let i = i0; i < i1; i++) if (t[i + 1] - t[i] > T_GAP)
      g.push([Math.round(u.valToPos(t[i], "x", true)) + 1, Math.round(u.valToPos(t[i + 1], "x", true))]);
    return g;
  };
  const axis = { font: "12px system-ui", stroke: "#333", grid: { stroke: "#eceff2" }, ticks: { stroke: "#c8ccd0" } };
  // the time axis on the data's own clock, ISO dates and 24-hour times: years, months, days, or times with the date
  // where the day changes
  const timeTicks = (u, splits, ax, space, incr) => splits.map((v, j) => {
    const s = tTime(v, incr < 60), p = j ? tTime(splits[j - 1]) : "";
    if (incr >= 365 * 86400) return s.slice(0, 4);
    if (incr >= 28 * 86400) return s.slice(0, 7);
    if (incr >= 86400) return j === 0 || p.slice(0, 4) !== s.slice(0, 4) ? `${s.slice(5, 10)}\n${s.slice(0, 4)}` : s.slice(5, 10);
    return j === 0 || p.slice(0, 10) !== s.slice(0, 10) ? `${s.slice(11)}\n${s.slice(0, 10)}` : s.slice(11);
  });
  TU = new uPlot({
    width: el.clientWidth, height: el.clientHeight,
    tzDate: ts => uPlot.tzDate(new Date(ts * 1e3), "Etc/UTC"),
    legend: { show: false },
    padding: [24, null, null, null],   // room for the readout (#t-info) over the plot
    cursor: { drag: { x: true, y: false }, points: { size: 8 }, dataIdx: (u, sidx, idx) => tPinned ?? idx },
    scales: { x: { time: true } },
    axes: [{ ...axis, values: timeTicks, size: 44, space: 70 },
           { ...axis, scale: "y0", size: 64, stroke: T_COLS[0] },
           ...(TP.cols.length > 1 ? [{ ...axis, scale: "y1", side: 1, size: 60, grid: { show: false }, stroke: T_COLS[1] }] : [])],
    series: [{}, ...TP.cols.map((c, i) => ({
      label: tr(c.label), scale: `y${i}`, stroke: T_COLS[i % T_COLS.length], width: 1.25, gaps, points: { show: false },
      show: i === 0 || !!$("t-cols").querySelector(`[data-col="${i}"]`)?.checked
    }))],
    hooks: {
      setScale: [(u, key) => { if (key === "x") tWindowFromChart(); }],
      setCursor: [u => tHover(u.cursor.idx)],
      draw: [u => { tDrawMarks(u); tDrawLanes(u); }]
    }
  }, [TS.t, ...TP.cols.map(c => TS.y[c.field])], el);
  TU.over.addEventListener("mousemove", () => { tPinned = null; });
}

// The window: [from, to] in seconds, or null for the whole span. It is the chart's time axis, so a drag, a double click
// and this all set it the same way
function tSetWindow(w) {
  if (!TU) return;
  const t = TS.t;
  TU.setScale("x", { min: w ? w[0] : t[0], max: w ? w[1] : t[t.length - 1] });
}
function tWindowFromChart() {
  TW = [TU.scales.x.min, TU.scales.x.max];
  cancelAnimationFrame(tFrame);
  tFrame = requestAnimationFrame(tDrawWindow);
}
function tDrawWindow() {
  if (!TS || !TW || !map.getSource("rb-time-line")) return;
  const t = TS.t, i0 = tFind(TW[0]), i1 = tFind(TW[1], true), lines = [];
  const n = i1 - i0, k = Math.max(1, Math.ceil(n / T_MAX)), v = TS.y[TP.cols[0].field], feats = [];
  // the line thinned as the pings are (a long line is most of a window's time to draw), its ends at a silence kept
  let cur = [], x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = i0; i < i1; i++) {
    if (cur.length && t[i] - t[i - 1] > T_GAP) { if (cur.length > 1) lines.push(cur); cur = []; }
    const x = TS.lon[i], y = TS.lat[i];
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    if (k === 1 || !cur.length || (i - i0) % k === 0 || i === i1 - 1 || t[i + 1] - t[i] > T_GAP) cur.push([x, y]);
  }
  if (cur.length > 1) lines.push(cur);
  for (let i = i0; i < i1; i++) {
    if ((i - i0) % k && !TS.mk[i]) continue;
    const p = { i };
    if (v[i] != null) p.v = v[i];
    if (TS.mk[i]) p.mk = TS.mk[i];
    feats.push({ type: "Feature", geometry: { type: "Point", coordinates: [TS.lon[i], TS.lat[i]] }, properties: p });
  }
  map.getSource("rb-time-line").setData({ type: "Feature", geometry: { type: "MultiLineString", coordinates: lines }, properties: {} });
  map.getSource("rb-time-pts").setData({ type: "FeatureCollection", features: feats });
  TS.n = n; TS.k = k;
  tInfo();
  if (n) map.fitBounds([[x0, y0], [x1, y1]], { padding: 40, maxZoom: 15, duration: 300 });
  writeAddress();
}
// the window in words, or the ping under the cursor
function tInfo(i = null) {
  if (!TS || !TW || TS.n == null) return;
  const lab = TP.time_label ? ` ${TP.time_label}` : "";
  $("t-info").textContent = i == null
    ? tr("tWindow", tTime(TW[0]), tTime(TW[1]), lab, TS.n.toLocaleString(loc())) + (TS.k > 1 ? ` · ${tr("tThinned", TS.k)}` : "")
    : `${tTime(TS.t[i], true)}${lab} · ` + TP.cols.map(c => `${tr(c.label)} ${tNum(TS.y[c.field][i])}`).join(" · ") +
      (TS.mk[i] ? ` · ${TS.mk[i]}` : "");
}
function tHover(i) {
  const src = map.getSource("rb-time-hover");
  if (!src || !TS) return;
  if (i == null || i < 0 || i >= TS.t.length) { src.setData(EMPTY); tInfo(); return; }
  src.setData({ type: "Feature", geometry: { type: "Point", coordinates: [TS.lon[i], TS.lat[i]] }, properties: {} });
  tInfo(i);
}
// the marked pings as ticks along the chart's top
function tDrawMarks(u) {
  if (!TS || !TP.marks.length) return;
  const c = u.ctx, { top } = u.bbox, h = 7 * devicePixelRatio, i0 = tFind(u.scales.x.min), i1 = tFind(u.scales.x.max, true);
  c.save();
  c.fillStyle = T_MARK;
  let last = -9;
  for (let i = i0; i < i1; i++) if (TS.mk[i]) {
    const x = Math.round(u.valToPos(TS.t[i], "x", true));
    if (x - last >= 2) { c.fillRect(x - devicePixelRatio, top, 2 * devicePixelRatio, h); last = x; }
  }
  c.restore();
}
// the lanes under the chart, on the chart's time axis: each interval a bar, its label inside where it fits
function tDrawLanes(u) {
  const cv = $("t-lanes"), L = TP.lanes;
  if (!L.length || !TS) return;
  const dpr = devicePixelRatio, w = cv.clientWidth, h = L.length * LANE_H;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c = cv.getContext("2d");
  c.scale(dpr, dpr);
  c.font = "12px system-ui"; c.textBaseline = "middle";
  const off = u.over.getBoundingClientRect().left - cv.getBoundingClientRect().left, pw = u.over.clientWidth;
  const a = u.scales.x.min, b = u.scales.x.max;
  L.forEach((lane, k) => {
    const d = TS.lanes?.[lane.id], y = k * LANE_H;
    c.fillStyle = "#5f6b76"; c.textAlign = "right";
    c.fillText(tr(lane.label), off - 6, y + LANE_H / 2, off - 8);
    if (!d) return;
    // a value keeps its colour along the lane, in the order the values first come in the span
    const col = new Map();
    for (const v of d.label ?? []) if (v != null && !col.has(v)) col.set(v, LANE_PAL[col.size % LANE_PAL.length]);
    for (let j = 0; j < d.t0.length; j++) {
      if (d.t1[j] < a || d.t0[j] > b) continue;
      const x0 = off + Math.max(0, u.valToPos(d.t0[j], "x")), x1 = off + Math.min(pw, u.valToPos(d.t1[j], "x"));
      c.fillStyle = d.label?.[j] != null ? col.get(d.label[j]) : LANE_FILL[j % 2];
      c.fillRect(x0, y + 3, Math.max(2, x1 - x0), LANE_H - 6);
      if (x1 - x0 > 30 && d.label?.[j] != null) {
        c.save(); c.beginPath(); c.rect(x0, y, x1 - x0, LANE_H); c.clip();
        c.fillStyle = "#222"; c.textAlign = "left"; c.fillText(String(d.label[j]), x0 + 3, y + LANE_H / 2);
        c.restore();
      }
    }
  });
}
// the interval under the pointer in the lanes, with a window around it
function tLaneAt(e) {
  if (!TU || !TS) return null;
  const r = $("t-lanes").getBoundingClientRect(), lane = TP.lanes[Math.floor((e.clientY - r.top) / LANE_H)];
  const d = lane && TS.lanes?.[lane.id];
  if (!d) return null;
  const x = e.clientX - TU.over.getBoundingClientRect().left, t = TU.posToVal(x, "x"), tol = TU.posToVal(x + 3, "x") - t;
  for (let j = 0; j < d.t0.length; j++) if (d.t0[j] - tol <= t && t <= d.t1[j] + tol) {
    const pad = Math.max(60, (d.t1[j] - d.t0[j]) * 0.05);
    return { lane, label: d.label?.[j], t0: d.t0[j], t1: d.t1[j], pad: [d.t0[j] - pad, d.t1[j] + pad] };
  }
  return null;
}
</script>
</body>
